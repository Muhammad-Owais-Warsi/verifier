<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trigger.dev usage verifier</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --border: #272e38;
        --text: #e6edf3;
        --muted: #8b949e;
        --pass: #3fb950;
        --fail: #f85149;
        --na: #6e7681;
        --warn: #d29922;
        --accent: #4493f8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 28px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 5;
      }
      h1 { font-size: 16px; margin: 0; font-weight: 600; }
      .spacer { flex: 1; }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 13px;
      }
      main { padding: 24px 28px; max-width: 1000px; }
      .score {
        display: flex;
        gap: 22px;
        align-items: baseline;
        padding: 18px 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .score .total { font-size: 30px; font-weight: 600; }
      .tally { color: var(--muted); font-size: 13px; }
      .tally b { color: var(--text); font-weight: 600; }
      .banner {
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 18px;
        border: 1px solid var(--border);
        background: #1c1600;
        border-color: #6b5400;
        color: #e3b341;
      }
      .check {
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 10px;
        background: var(--panel);
        overflow: hidden;
      }
      .check summary {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        cursor: pointer;
        list-style: none;
      }
      .check summary::-webkit-details-marker { display: none; }
      .badge {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 3px 8px;
        border-radius: 4px;
        min-width: 58px;
        text-align: center;
        flex-shrink: 0;
      }
      .pass { background: rgba(63,185,80,0.15); color: var(--pass); }
      .fail { background: rgba(248,81,73,0.15); color: var(--fail); }
      .na { background: rgba(110,118,129,0.15); color: var(--na); }
      .inconclusive { background: rgba(210,153,34,0.15); color: var(--warn); }
      .title { font-weight: 500; }
      .mech {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 2px 7px;
        border-radius: 10px;
        margin-left: auto;
        flex-shrink: 0;
      }
      .body { padding: 0 16px 16px 16px; border-top: 1px solid var(--border); padding-top: 14px; }
      .why { margin: 0 0 14px 0; white-space: pre-wrap; }
      .kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 14px; font-size: 13px; margin-bottom: 12px; }
      .kv dt { color: var(--muted); }
      .kv dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
      .evidence { border-top: 1px solid var(--border); padding-top: 12px; }
      .evidence div { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; margin-bottom: 6px; color: var(--muted); }
      .evidence code { color: var(--text); }
      a { color: var(--accent); }
      #log {
        background: #010409;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px;
        white-space: pre-wrap;
        max-height: 260px;
        overflow-y: auto;
        margin-bottom: 20px;
        display: none;
        color: var(--muted);
      }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 26px 0 12px; }
      .empty { color: var(--muted); padding: 40px 0; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1>Trigger.dev usage verifier</h1>
      <select id="target"></select>
      <span class="spacer"></span>
      <button id="run">Run verifier</button>
    </header>

    <main>
      <div id="log"></div>
      <div id="content"><p class="empty">No results yet. Click <b>Run verifier</b>.</p></div>
    </main>

    <script>
      const el = (id) => document.getElementById(id);
      const escapeHtml = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
        );

      async function loadTargets() {
        const { targets } = await (await fetch("/api/targets")).json();
        el("target").innerHTML = targets
          .map((t) => `<option value="${escapeHtml(t.id)}">${escapeHtml(t.label)}</option>`)
          .join("");
      }

      function renderEvidence(evidence) {
        if (!evidence?.length) return "";
        const rows = evidence
          .map((e) => {
            if (e.runId) {
              const link = e.dashboard
                ? `<a href="${escapeHtml(e.dashboard)}" target="_blank" rel="noreferrer">${escapeHtml(e.runId)}</a>`
                : escapeHtml(e.runId);
              return `<div>run ${link}</div>`;
            }
            const loc = `${escapeHtml(e.file ?? "")}${e.line ? ":" + e.line : ""}`;
            return `<div>${loc} &nbsp; <code>${escapeHtml(e.snippet ?? "")}</code></div>`;
          })
          .join("");
        return `<div class="evidence">${rows}</div>`;
      }

      function renderCheck(check) {
        return `
          <details class="check" ${check.status === "fail" ? "open" : ""}>
            <summary>
              <span class="badge ${check.status}">${check.status.toUpperCase()}</span>
              <span class="title">${escapeHtml(check.title)}</span>
              ${check.mechanism ? `<span class="mech">${escapeHtml(check.mechanism)}</span>` : ""}
            </summary>
            <div class="body">
              <p class="why">${escapeHtml(check.why)}</p>
              <dl class="kv">
                <dt>Expected</dt><dd>${escapeHtml(check.expected)}</dd>
                <dt>Actual</dt><dd>${escapeHtml(check.actual)}</dd>
              </dl>
              ${renderEvidence(check.evidence)}
            </div>
          </details>`;
      }

      function render(report, history) {
        if (!report) {
          el("content").innerHTML = '<p class="empty">No results yet.</p>';
          return;
        }

        const s = report.score;
        const banner = report.aborted
          ? `<div class="banner"><b>Stopped at ${escapeHtml(report.aborted.stage)}.</b> ${escapeHtml(report.aborted.reason)}</div>`
          : "";

        const groups = {};
        for (const check of report.checks) (groups[check.category] ??= []).push(check);

        const sections = Object.entries(groups)
          .map(
            ([category, checks]) =>
              `<h2>${escapeHtml(category)}</h2>${checks.map(renderCheck).join("")}`
          )
          .join("");

        el("content").innerHTML = `
          ${banner}
          <div class="score">
            <span class="total">${s.total}</span>
            <span class="tally">
              <b>${s.passed}</b> passed &nbsp; <b>${s.failed}</b> failed
              &nbsp; <b>${s.na}</b> n/a
            </span>
            <span class="spacer"></span>
            <span class="tally">${escapeHtml(report.submission)} &middot; ${escapeHtml(report.generatedAt)}</span>
          </div>
          ${sections}`;
      }

      async function run() {
        const buttons = [el("run")];
        buttons.forEach((b) => (b.disabled = true));
        el("log").style.display = "block";
        el("log").textContent = "";

        try {
          const target = encodeURIComponent(el("target").value);
          const res = await fetch(`/api/run?target=${target}`, { method: "POST" });
          if (res.status === 409) {
            el("log").textContent = "A verification is already running.";
            return;
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() ?? "";

            for (const line of lines) {
              if (!line.trim()) continue;
              const event = JSON.parse(line);
              if (event.type === "progress") {
                el("log").textContent += event.message + "\n";
                el("log").scrollTop = el("log").scrollHeight;
              } else if (event.type === "done") {
                render(event.report);
              } else if (event.type === "error") {
                el("log").textContent += "\nERROR: " + event.message + "\n";
              }
            }
          }
        } finally {
          buttons.forEach((b) => (b.disabled = false));
        }
      }

      el("run").onclick = () => run();

      (async () => {
        await loadTargets();
        const { report } = await (await fetch("/api/report")).json();
        render(report);
      })();
    </script>
  </body>
</html>
